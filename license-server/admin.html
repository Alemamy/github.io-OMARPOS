<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OmarPOS | لوحة الإدارة</title><link rel="stylesheet" href="admin.css"></head><body><main><header><div><h1>OmarPOS</h1><p>لوحة إدارة الاشتراكات المركزية</p></div><button id="logout" class="secondary hidden">تسجيل الخروج</button></header><section id="login" class="card"><h2>دخول الإدارة</h2><input id="au" placeholder="اسم المستخدم" autocomplete="username"><input id="ap" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button id="loginBtn" class="primary">دخول</button><div id="msg"></div></section><section id="panel" class="hidden"><div class="stats"><div><b id="total">0</b><small>إجمالي العملاء</small></div><div><b id="active">0</b><small>نشط</small></div><div><b id="suspended">0</b><small>موقوف</small></div><div><b id="expired">0</b><small>منتهي</small></div></div><div class="toolbar"><input id="search" placeholder="🔎 بحث باسم المستخدم"><button id="add" class="primary">＋ إضافة اشتراك</button></div><div class="card tableWrap"><table><thead><tr><th>المستخدم</th><th>الخطة</th><th>البداية</th><th>الانتهاء</th><th>المتبقي</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><div id="modal" class="modal hidden"><div class="modalBox"><h2 id="modalTitle">إضافة اشتراك</h2><form id="form"><input id="fuser" required placeholder="اسم المستخدم"><input id="fpass" type="password" placeholder="كلمة المرور"><select id="fplan"><option value="7days">7 أيام</option><option value="monthly">شهري</option><option value="yearly">سنوي</option><option value="lifetime">مدى الحياة</option></select><label>تاريخ البداية<input id="fstart" type="datetime-local" required></label><label>تاريخ الانتهاء<input id="fend" type="datetime-local"></label><select id="fstatus"><option value="active">نشط</option><option value="suspended">موقوف</option></select><div class="actions"><button type="submit" class="primary">حفظ</button><button type="button" id="cancel" class="secondary">إلغاء</button></div></form></div></div><script src="admin.js?v=2"></script></body></html>
